<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICP Command Center — Software Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0F3031; --forest-2:#163F40; --forest-3:#1D4E4F; --lime:#B3FA68; --lime-dim:#8FD94C;
    --cream:#F7F5EF; --paper:#FFFFFF; --ink:#12201F; --ink-soft:#5B6B69; --line:#E4E0D4;
    --accept:#2F8F4E; --accept-bg:#E4F5E6; --reject:#C4433A; --reject-bg:#FBE9E7;
    --cond:#9A7B1F; --cond-bg:#FBF1D8; --special:#8B5FBF; --special-bg:#F0E9F8;
    --radius:10px; --shadow: 0 1px 2px rgba(15,48,49,0.06), 0 8px 24px -12px rgba(15,48,49,0.18);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Top bar: brand + category tabs ---------- */
  .topbar-wrap{position:sticky; top:0; z-index:15; background:var(--forest); box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .topbar-inner{display:flex; align-items:center; gap:20px; padding:14px 26px; max-width:100%;}
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand .mark{width:32px; height:32px; border-radius:8px; background:var(--lime); display:flex; align-items:center; justify-content:center; color:var(--forest); font-family:'Fraunces',serif; font-weight:700; font-size:16px;}
  .brand .name{font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:#fff; line-height:1.15;}
  .brand .sub{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em; color:#93B0AC; text-transform:uppercase;}
  .cat-tabs{display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:thin;}
  .cat-tabs::-webkit-scrollbar{height:6px;}
  .cat-tab{flex-shrink:0; white-space:nowrap; display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:12.8px; color:#C9DDD9; background:rgba(255,255,255,0.05); border:1px solid transparent; transition:background .12s ease, color .12s ease;}
  .cat-tab:hover{background:rgba(255,255,255,0.1); color:#fff;}
  .cat-tab.active{background:var(--lime); color:var(--forest); font-weight:700;}
  .cat-tab .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.75;}

  /* ---------- Body layout: filter panel + main content ---------- */
  .body-layout{display:flex; align-items:flex-start;}
  .filter-panel{width:284px; flex-shrink:0; background:var(--forest); color:#DCEAE7; padding:18px 16px 22px; position:sticky; top:57px; height:calc(100vh - 57px); overflow-y:auto;}
  .filter-block{margin-bottom:16px;}
  .filter-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#6E938E; margin-bottom:7px;}
  .side-search{width:100%; box-sizing:border-box; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08); color:#fff; outline:none;}
  .side-search::placeholder{color:#9FC0BA;}
  .side-search:focus{border-color:var(--lime); background:rgba(255,255,255,0.13);}
  .status-pills{display:flex; flex-wrap:wrap; gap:5px;}
  .status-pill-btn{flex:1; min-width:60px; text-align:center; padding:7px 6px; border-radius:7px; font-size:11.5px; font-weight:600; cursor:pointer; background:rgba(255,255,255,0.06); color:#C9DDD9; border:1px solid transparent;}
  .status-pill-btn:hover{background:rgba(255,255,255,0.12);}
  .status-pill-btn.on{background:var(--lime); color:var(--forest);}

  details.filter-group{border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;}
  details.filter-group summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600; color:#fff; padding-bottom:8px;}
  details.filter-group summary::-webkit-details-marker{display:none;}
  details.filter-group summary::after{content:"▾"; font-size:10px; color:#8FB5AE; transition:transform .15s ease;}
  details.filter-group[open] summary::after{transform:rotate(180deg);}
  details.filter-group .count-badge{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--lime); font-weight:400;}

  .ms-search{width:100%; box-sizing:border-box; font-family:'Inter',sans-serif; font-size:12.5px; padding:8px 9px; margin-bottom:6px; border-radius:7px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08); color:#fff; outline:none;}
  .ms-search::placeholder{color:#9FC0BA;}
  .ms-search:focus{border-color:var(--lime);}
  .ms-options{max-height:200px; overflow-y:auto; overflow-x:hidden; margin-bottom:6px;}
  .ms-option{display:flex; align-items:flex-start; gap:9px; padding:6px 4px; border-radius:6px; font-size:12.5px; color:#DCEAE7; cursor:pointer;}
  .ms-option span{flex:1; min-width:0; word-break:break-word; line-height:1.4; padding-top:1px;}
  .ms-option:hover{background:rgba(255,255,255,0.08);}
  .ms-option input[type=checkbox]{
    appearance:none; -webkit-appearance:none; flex-shrink:0;
    width:16px !important; height:16px !important; min-width:16px !important; max-width:16px !important;
    padding:0 !important; margin:1px 0 0; border-radius:4px; box-sizing:border-box;
    border:1.5px solid rgba(255,255,255,0.38); background:rgba(255,255,255,0.04);
    cursor:pointer; position:relative;
  }
  .ms-option input[type=checkbox]:checked{background:var(--lime); border-color:var(--lime);}
  .ms-option input[type=checkbox]:checked::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; color:var(--forest); font-weight:700;
  }
  .ms-option:hover input[type=checkbox]{border-color:var(--lime);}
  .ms-option-single{padding:7px 6px; border-radius:6px; font-size:12.5px; color:#DCEAE7; cursor:pointer; word-break:break-word;}
  .ms-option-single:hover{background:rgba(255,255,255,0.08);}
  .ms-option-single.ms-option-active{background:rgba(179,250,104,0.14); color:var(--lime); font-weight:600;}
  .ms-empty{padding:8px 4px; font-size:12px; color:#9FC0BA;}
  .ms-chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px;}
  .ms-chip{display:inline-flex; align-items:center; gap:5px; background:rgba(179,250,104,0.14); color:var(--lime); border:1px solid rgba(179,250,104,0.3); border-radius:20px; padding:3px 6px 3px 10px; font-size:10.5px; font-weight:600;}
  .ms-chip-x{background:none; border:none; color:var(--lime); cursor:pointer; font-size:13px; line-height:1; padding:0 3px;}

  .emp-input{width:100%; box-sizing:border-box; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08); color:#fff; outline:none;}
  .emp-input::placeholder{color:#9FC0BA;}
  .emp-input:focus{border-color:var(--lime); background:rgba(255,255,255,0.13);}

  .clear-filters-btn{width:100%; margin-top:6px; padding:9px; border-radius:8px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); color:#DCEAE7; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .clear-filters-btn:hover{background:rgba(255,255,255,0.12);}

  .side-foot{margin-top:16px; padding:12px 12px; border-radius:10px; background:rgba(179,250,104,0.08); border:1px solid rgba(179,250,104,0.18); font-size:11.5px; line-height:1.5; color:#B8CFCB;}
  .side-foot b{color:var(--lime); font-weight:600;}
  .side-refresh{margin-top:10px; width:100%; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#DCEAE7; font-size:11.5px; cursor:pointer; font-family:'Inter',sans-serif;}
  .side-refresh:hover{background:rgba(255,255,255,0.12);}
  .side-updated{font-size:10px; color:#6E938E; margin-top:6px; text-align:center; font-family:'IBM Plex Mono',monospace;}

  /* ---------- Main content ---------- */
  .main-content{flex:1; min-width:0; padding:24px 32px 60px;}
  .content-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .content-head h1{font-size:23px; margin:0 0 3px; color:var(--forest);}
  .content-head .desc{font-size:12.8px; color:var(--ink-soft);}
  .content-head .count{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);}

  .vgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:14px;}
  .vcard{background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:16px 17px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; position:relative;}
  .vcard.has-fit{border-left:4px solid var(--line);}
  .vcard.fit-yes{border-left-color:var(--accept);}
  .vcard.fit-cond{border-left-color:var(--cond);}
  .vcard.fit-no{opacity:0.6;}
  .vcard-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .vcard-head h3{font-size:16.5px; margin:0; color:var(--ink); line-height:1.25;}
  .badge-row{display:flex; gap:5px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}
  .status-pill{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:20px; font-weight:700;}
  .status-active{background:var(--accept-bg); color:var(--accept);}
  .status-paused{background:var(--cond-bg); color:var(--cond);}
  .status-inactive{background:var(--reject-bg); color:var(--reject);}
  .fit-pill{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.05em; padding:3px 9px; border-radius:20px; font-weight:700; text-transform:uppercase;}
  .fit-pill.fit-yes{background:var(--accept-bg); color:var(--accept);}
  .fit-pill.fit-cond{background:var(--cond-bg); color:var(--cond);}
  .fit-pill.fit-no{background:var(--reject-bg); color:var(--reject);}
  .fit-reason{font-size:11.5px; color:var(--ink-soft); margin-top:-4px;}
  .uqc-note{font-size:11px; font-weight:600; color:#8B5FBF; background:var(--special-bg); border-radius:6px; padding:5px 8px; line-height:1.4;}

  .meta-row{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11.8px; color:var(--ink-soft);}
  .meta-row span b{color:var(--ink); font-weight:600;}
  .tagwrap{display:flex; flex-wrap:wrap; gap:5px; max-height:98px; overflow:hidden; position:relative; transition:max-height .2s ease;}
  .tagwrap.expanded{max-height:2000px;}
  .chip{font-size:11px; padding:3.5px 9px; border-radius:20px; font-weight:600; border:1px solid transparent; user-select:none;}
  .chip.accept{background:var(--accept-bg); color:var(--accept);}
  .chip.reject{background:var(--reject-bg); color:var(--reject);}
  .chip.conditional{background:var(--cond-bg); color:var(--cond);}
  .chip.special{background:var(--special-bg); color:var(--special);}
  .expand-toggle{font-size:11px; color:var(--forest-3); font-weight:600; cursor:pointer; align-self:flex-start;}

  details.vdetails{border-top:1px dashed var(--line); padding-top:8px; margin-top:2px;}
  details.vdetails summary{font-size:11.5px; font-weight:600; color:var(--forest-3); cursor:pointer; list-style:none;}
  details.vdetails summary::-webkit-details-marker{display:none;}
  details.vdetails summary::before{content:"+ ";}
  details.vdetails[open] summary::before{content:"– ";}
  .detail-item{margin-top:8px; font-size:12px; line-height:1.55; color:var(--ink-soft);}
  .detail-item b{display:block; color:var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace; margin-bottom:2px;}
  .detail-item + .detail-item{margin-top:10px;}

  .empty-cat{background:var(--paper); border:1px dashed var(--line); border-radius:13px; padding:40px 30px; text-align:center; color:var(--ink-soft); font-size:13px; grid-column:1/-1;}
  .empty-cat b{color:var(--forest); display:block; font-family:'Fraunces',serif; font-size:16px; margin-bottom:6px;}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--forest); color:#fff; padding:11px 18px; border-radius:10px; font-size:12.8px; box-shadow:0 10px 30px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:all .25s ease; display:flex; align-items:center; gap:10px; z-index:50; max-width:440px;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .dot{width:7px; height:7px; border-radius:50%; background:var(--lime); flex-shrink:0;}

  .loadstate{padding:80px 20px; text-align:center; color:var(--ink-soft); grid-column:1/-1;}
  .loadstate .spin{width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--forest); margin:0 auto 14px; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-box{background:#FBE9E7; border:1px solid #EFC1BC; color:#8A2E27; border-radius:12px; padding:18px 20px; font-size:13px; line-height:1.6; max-width:640px; grid-column:1/-1;}
  .err-box b{display:block; font-family:'Fraunces',serif; font-size:16px; margin-bottom:6px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#D8D3C4; border-radius:20px;}
  .filter-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);}

  @media (max-width:900px){
    .body-layout{flex-direction:column;}
    .filter-panel{width:100%; height:auto; position:relative; top:0;}
    .main-content{padding:18px;}
  }
</style>
</head>

<div class="topbar-wrap">
  <div class="topbar-inner">
    <div class="brand">
      <div class="mark">SF</div>
      <div><div class="name">ICP Command Center</div><div class="sub">Client Fulfillment</div></div>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
  </div>
</div>

<div class="body-layout">
  <aside class="filter-panel">
    <div class="filter-block">
      <input class="side-search" id="searchInput" type="text" placeholder="Search vendor name or industry…">
    </div>
    <div class="filter-block">
      <div class="filter-label">Status</div>
      <div class="status-pills" id="statusToggle">
        <div class="status-pill-btn on" data-status="all">All</div>
        <div class="status-pill-btn" data-status="Active">Active</div>
        <div class="status-pill-btn" data-status="Paused">Paused</div>
        <div class="status-pill-btn" data-status="Inactive">Inactive</div>
      </div>
    </div>

    <details class="filter-group" open>
      <summary>Industries <span class="count-badge" id="industryCountBadge"></span></summary>
      <div id="ms-industry-search-wrap"></div>
    </details>
    <div class="ms-chips" id="ms-industry-chips" style="margin:0 0 12px;"></div>

    <details class="filter-group">
      <summary>Features <span class="count-badge" id="featureCountBadge"></span></summary>
      <div id="ms-feature-search-wrap"></div>
    </details>
    <div class="ms-chips" id="ms-feature-chips" style="margin:0 0 12px;"></div>

    <div class="filter-block" style="border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;">
      <div class="filter-label">Employee count</div>
      <input class="emp-input" id="chkEmp" type="number" placeholder="e.g. 150" min="0">
    </div>

    <details class="filter-group">
      <summary>Geography <span class="count-badge" id="geoCountBadge"></span></summary>
      <div id="ms-geo-search-wrap"></div>
    </details>

    <button class="clear-filters-btn" id="clearFiltersBtn">Clear all filters</button>

    <div class="side-foot"><b>Live source —</b> reading directly from your Google Sheet. Edit ICPs there; refresh here to see changes.</div>
    <button class="side-refresh" id="refreshBtn">↻ Refresh data</button>
    <div class="side-updated" id="lastUpdated"></div>
  </aside>

  <main class="main-content">
    <div class="content-head">
      <div><h1 id="catTitle">Loading…</h1><div class="desc" id="catDesc">Connecting to your Google Sheet…</div></div>
      <span class="count" id="gridCount"></span>
    </div>
    <div class="vgrid" id="contentArea">
      <div class="loadstate"><div class="spin"></div>Loading your live ICP data…</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

function buildUrl(){
  const ranges = CATEGORIES.map(c => 'ranges=' + encodeURIComponent(c)).join('&');
  return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchGet?${ranges}&key=${API_KEY}&_=${Date.now()}`;
}

function normalizeCombo(str){
  const s = str.toString().toLowerCase().replace(/\bonly\b/g,'').trim();
  const parts = s.split(/[+/]|\band\b/i).map(p => p.trim().toUpperCase()).filter(Boolean);
  return new Set(parts);
}

function comboLabel(set){
  const arr = [...set].sort();
  return arr.length === 1 ? `${arr[0]} Only` : arr.join(' + ');
}

function rowsToVendors(values, categoryName){
  if(!values || values.length < 2) return [];
  const header = values[0];
  const findCol = re => header.findIndex(h => h && re.test(h.toString()));
  const cName = findCol(/^name$/i), cStatus = findCol(/^status$/i),
        cEmp = findCol(/emp count|employee|no\.?\s*of\b|provider|# of users|no\. of users/i),
        cGeo = findCol(/geograph|location/i),
        cFeat = findCol(/^features/i), cNotes = findCol(/^notes/i), cDonts = findCol(/don'?ts?/i),
        cMandatory = findCol(/^mandatory\s*feature$/i);
  const cUqc = header.findIndex(h => h && h.toString().toLowerCase().includes('unique') && h.toString().toLowerCase().includes('criteria'));
  const indCols = header.reduce((arr,h,i)=>{ if(h && h.toString().startsWith('Accepted Industry')) arr.push(i); return arr; }, []);
  const featureNCols = header.reduce((arr,h,i)=>{ if(h && /^feature\s*\d+$/i.test(h.toString().trim())) arr.push(i); return arr; }, []);
  const vendors = [];
  for(let i=1;i<values.length;i++){
    const row = values[i];
    const name = row[cName]; if(!name) continue;
    const tags = [];
    indCols.forEach(c=>{ const v = row[c]; if(v) tags.push({ name: v, status: 'accept', note: null }); });
    const details = {};
    if(cEmp>=0 && row[cEmp]) details['Emp Count'] = row[cEmp];
    if(cGeo>=0 && row[cGeo]) details['Geography'] = row[cGeo];
    if(cFeat>=0 && row[cFeat]) details['Features'] = row[cFeat];
    if(cNotes>=0 && row[cNotes]) details['Notes'] = row[cNotes];
    if(cDonts>=0 && row[cDonts]) details["Don'ts"] = row[cDonts];
    const vendor = { name, status: (cStatus>=0 && row[cStatus]) || 'Active', tags, details };
    if(cUqc>=0 && row[cUqc]) vendor.uqc = row[cUqc];
    if(categoryName === 'Medical'){
      vendor.medicalCombos = featureNCols.map(c => row[c]).filter(Boolean).map(normalizeCombo);
    } else if(categoryName === 'HR'){
      vendor.hrMandatory = (cMandatory>=0 && row[cMandatory]) ? row[cMandatory].toString().trim() : null;
      vendor.hrOptional = featureNCols.map(c => row[c]).filter(Boolean);
    }
    vendors.push(vendor);
  }
  return vendors;
}

async function loadData(){
  document.getElementById('contentArea').innerHTML = '<div class="loadstate"><div class="spin"></div>Loading your live ICP data…</div>';
  try{
    const res = await fetch(buildUrl(), { cache: 'no-store' });
    if(!res.ok){
      const body = await res.text();
      throw new Error(`HTTP ${res.status}: ${body.slice(0,300)}`);
    }
    const json = await res.json();
    DATA = {};
    (json.valueRanges || []).forEach(vr => {
      const catName = vr.range.split('!')[0].replace(/^'|'$/g, '');
      DATA[catName] = rowsToVendors(vr.values, catName);
    });
    state.category = state.category && DATA[state.category] ? state.category : CATEGORIES.find(c => DATA[c] && DATA[c].length) || CATEGORIES[0];
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  } catch(err){
    document.getElementById('contentArea').innerHTML = `<div class="err-box"><b>Couldn't load live data</b>
      ${err.message}<br><br>
      Common causes: the sheet isn't shared as "Anyone with the link → Viewer", the Google Sheets API isn't enabled on the project, the API key restrictions block this page, or a tab name doesn't exactly match ${CATEGORIES.join(', ')}.</div>`;
    document.getElementById('catTitle').textContent = 'Connection error';
    document.getElementById('catDesc').textContent = '';
  }
}

function parseEmpFloor(text){
  if(!text) return null;
  const nums = (text.toString().match(/\d[\d,]*/g) || []).map(n => parseInt(n.replace(/,/g,''), 10));
  if(nums.length === 0) return null;
  return Math.min(...nums);
}

function geoMatches(locVal, country){
  if(!country) return { ok: true, note: null };
  if(!locVal) return { ok: true, note: null };
  const lower = locVal.toLowerCase();
  if(/worldwide|global|all countries|anywhere|international/.test(lower)) return { ok: true, note: null };
  const aliases = (GEO_ALIASES[country] || []).map(a => a.toLowerCase());
  const candidates = [country.toLowerCase(), ...aliases];
  const ok = candidates.some(c => lower.includes(c));
  return { ok, note: ok ? null : `geo may not match (${locVal})` };
}

function featureMatches(v, featureLabel){
  if(!featureLabel) return { ok: true, note: null };
  const list = FEATURE_LISTS[state.category] || [];
  const entry = list.find(f => f.label === featureLabel);
  if(!entry) return { ok: true, note: null };
  const combined = [v.details['Features'], v.details['Notes'], v.details["Don'ts"]].filter(Boolean).join(' ').toLowerCase();
  const ok = entry.synonyms.some(s => combined.includes(s));
  return { ok, note: ok ? null : `"${featureLabel}" not mentioned in listing — verify manually` };
}

function industriesMatch(v, selectedIndustries){
  if(selectedIndustries.length === 0) return { ok: true, fails: [] };
  const fails = [];
  for(const ind of selectedIndustries){
    const tag = v.tags.find(t => t.name === ind);
    if(!tag || tag.status !== 'accept') fails.push(ind);
  }
  return { ok: fails.length === 0, fails };
}

function featuresMatch(v, selectedFeatures){
  if(selectedFeatures.length === 0) return { ok: true, fails: [], excluded: false };

  if(state.category === 'Medical'){
    if(!v.medicalCombos || v.medicalCombos.length === 0) return { ok: false, fails: [], excluded: true };
    const vendorLabels = new Set(v.medicalCombos.map(comboLabel));
    const matches = selectedFeatures.some(sel => vendorLabels.has(sel));
    return { ok: matches, fails: matches ? [] : ['none of the selected combinations are offered'], excluded: false };
  }

  if(state.category === 'HR'){
    if(v.hrMandatory){
      const ok = selectedFeatures.includes(v.hrMandatory);
      return { ok, fails: ok ? [] : [`requires mandatory feature: ${v.hrMandatory}`], excluded: false };
    }
    const opt = v.hrOptional || [];
    const fails = selectedFeatures.filter(f => !opt.includes(f));
    return { ok: fails.length === 0, fails, excluded: false };
  }

  const fails = [];
  for(const feat of selectedFeatures){
    const { ok } = featureMatches(v, feat);
    if(!ok) fails.push(feat);
  }
  return { ok: fails.length === 0, fails, excluded: false };
}

const msState = { industry: new Set(), feature: new Set() };
const msQuery = { industry: '', feature: '', geo: '' };
let geoState = '';

function getIndustryOptions(){
  const cat = DATA[state.category] || [];
  const names = new Set();
  cat.forEach(v => v.tags.forEach(t => names.add(t.name)));
  return [...names].sort();
}
function getFeatureOptionLabels(){
  const cat = DATA[state.category] || [];
  if(state.category === 'Medical'){
    const labels = new Set();
    cat.forEach(v => (v.medicalCombos || []).forEach(combo => labels.add(comboLabel(combo))));
    return [...labels].sort();
  }
  if(state.category === 'HR'){
    const tokens = new Set();
    cat.forEach(v => {
      if(v.hrMandatory) tokens.add(v.hrMandatory);
      (v.hrOptional || []).forEach(f => tokens.add(f));
    });
    return [...tokens].sort();
  }
  const list = FEATURE_LISTS[state.category] || [];
  return list.map(f => f.label);
}

function renderMultiSelect(kind){
  const wrap = document.getElementById(`ms-${kind}-search-wrap`);
  if(!wrap) return;
  msQuery[kind] = '';
  wrap.innerHTML = `<input type="text" class="ms-search" id="ms-${kind}-search" placeholder="Search…" autocomplete="off">
    <div class="ms-options" id="ms-${kind}-options"></div>`;
  document.getElementById(`ms-${kind}-search`).addEventListener('input', (e)=>{
    msQuery[kind] = e.target.value.toLowerCase();
    renderOptionsList(kind);
  });
  renderOptionsList(kind);
  renderChips(kind);
}

function renderOptionsList(kind){
  const allOptions = kind === 'industry' ? getIndustryOptions() : getFeatureOptionLabels();
  const q = msQuery[kind] || '';
  const options = q ? allOptions.filter(o => o.toLowerCase().includes(q)) : allOptions;
  const selected = msState[kind];
  const container = document.getElementById(`ms-${kind}-options`);
  if(!container) return;
  container.innerHTML = options.length ? options.map(opt => {
    const safe = opt.replace(/"/g,'&quot;');
    return `<label class="ms-option"><input type="checkbox" value="${safe}" ${selected.has(opt)?'checked':''} data-kind="${kind}"><span>${opt}</span></label>`;
  }).join('') : `<div class="ms-empty">${q ? 'No matches' : `No ${kind==='industry'?'industries':'standard features'} for this category`}</div>`;
  container.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const val = e.target.value;
      if(e.target.checked) msState[kind].add(val); else msState[kind].delete(val);
      renderChips(kind);
      renderGrid();
    });
  });
}

function renderChips(kind){
  const selected = [...msState[kind]];
  const chipsEl = document.getElementById(`ms-${kind}-chips`);

  if(badge) badge.textContent = selected.length ? `(${selected.length})` : '';

  chipsEl.innerHTML = selected.map(v => {
    const safe = v.replace(/"/g,'&quot;');
    return `<span class="ms-chip">${v}<button type="button" class="ms-chip-x" data-kind="${kind}" data-val="${safe}">×</button></span>`;

/* ---------- Live fit evaluation ---------- */
function hasActiveFilters(){
  const empEl = document.getElementById('chkEmp');
  const empVal = empEl ? empEl.value.trim() : '';
  return msState.industry.size > 0 || msState.feature.size > 0 || empVal !== '' || !!geoState;
}

function evaluateFit(v){
  const selectedIndustries = [...msState.industry];
  const selectedFeatures = [...msState.feature];
  const empEl = document.getElementById('chkEmp');
  const empVal = empEl ? empEl.value.trim() : '';
  const empNum = empVal ? parseInt(empVal, 10) : null;
  const geoCountry = geoState;

  if(v.status !== 'Active'){
    return { fit: 'no', label: `${v.status} — not currently taking leads` };
  }

  const { ok: indOk, fails: indFails } = industriesMatch(v, selectedIndustries);
  const { ok: featOk, fails: featFails, excluded: featExcluded } = featuresMatch(v, selectedFeatures);

  const locKey = Object.keys(v.details).find(k => /geograph|location/i.test(k));
  const locVal = locKey ? v.details[locKey] : '';
  const { ok: geoOk, note: geoNote } = geoMatches(locVal, geoCountry);

  const empKey = Object.keys(v.details).find(k => /emp count|employee|provider|user/i.test(k));
  const empFloor = empKey ? parseEmpFloor(v.details[empKey]) : null;
  let empOk = true, empNote = null;
  if(empNum !== null){
    if(empFloor === null){ empOk = true; empNote = 'employee count unclear — verify manually'; }
    else if(empNum < empFloor){ empOk = false; empNote = `below vendor's minimum (${v.details[empKey]})`; }
  }

  if(featExcluded) return { fit: 'no', label: 'No feature data on file for this vendor' };
  if(!indOk) return { fit: 'no', label: `Doesn't accept: ${indFails.join(', ')}` };

  const hardFails = !geoOk || !empOk || !featOk;
  const featIssue = featFails.length ? `Doesn't match feature: ${featFails.join(', ')}` : null;
  const issues = [geoNote, empNote, featIssue].filter(Boolean);
  if(hardFails) return { fit: 'no', label: issues.join('; ') };
  if(issues.length) return { fit: 'cond', label: issues.join('; ') };
  return { fit: 'yes', label: 'Fits ICP' };
}

/* ---------- Rendering ---------- */
function renderCategoryTabs(){
  const wrap = document.getElementById('catTabs');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const has = DATA[cat] && DATA[cat].length;
    const el = document.createElement('div');
    el.className = 'cat-tab' + (cat===state.category?' active':'');
    el.style.opacity = has ? 1 : 0.4;
    el.innerHTML = `<span>${cat}</span><span class="cnt">${has ? catCount(cat) : '—'}</span>`;
    el.onclick = ()=>{ state.category = cat; state.search=''; document.getElementById('searchInput').value=''; render(); };
    wrap.appendChild(el);
  });
}

function statusClass(s){
  const l = (s||'').toLowerCase();
  if(l==='paused') return 'status-paused';
  if(l==='inactive') return 'status-inactive';
  return 'status-active';
}

function renderGrid(){
  const cat = DATA[state.category] || [];
  const grid = document.getElementById('contentArea');
  if(!grid) return;
  const q = state.search.trim().toLowerCase();
  const filtersActive = hasActiveFilters();

  let filtered = cat.filter(v=>{
    if(state.statusFilter !== 'all' && v.status !== state.statusFilter) return false;
    if(!q) return true;
    if(v.name.toLowerCase().includes(q)) return true;
    return v.tags.some(t=>t.name.toLowerCase().includes(q));
  });

  let withFit = filtered.map(v => ({ v, fitInfo: filtersActive ? evaluateFit(v) : null }));

  if(filtersActive){
    const order = { yes: 0, cond: 1, no: 2 };
    withFit.sort((a,b)=> order[a.fitInfo.fit] - order[b.fitInfo.fit]);
  }

  document.getElementById('catTitle').textContent = state.category;
  document.getElementById('catDesc').textContent = `Vendor ICPs for ${state.category} — live from your Google Sheet.`;
  document.getElementById('gridCount').textContent = withFit.length + ' of ' + cat.length;

  if(cat.length === 0){
    grid.innerHTML = `<div class="empty-cat"><b>${state.category} not connected yet</b>Check that this tab exists in your Google Sheet with the expected columns.</div>`;
    return;
  }
  if(withFit.length === 0){
    grid.innerHTML = `<div class="empty-cat"><b>No matches</b>Try different filters or clear them to browse everyone.</div>`;
    return;
  }

  grid.innerHTML = withFit.map(({v, fitInfo}, idx)=>{
    const employeeKey = Object.keys(v.details).find(k => /emp count|employee|provider|user/i.test(k));
    const locKey = Object.keys(v.details).find(k => /geograph|location/i.test(k));
    const metaBits = [];
    if(employeeKey) metaBits.push(`<span><b>${v.details[employeeKey]}</b></span>`);
    if(locKey) metaBits.push(`<span>${v.details[locKey]}</span>`);
    const chips = v.tags.map((t,i)=>`<span class="chip ${t.status}" data-vendor="${v.name.replace(/"/g,'')}" data-tag="${t.name.replace(/"/g,'')}" title="${t.note ? t.note.replace(/"/g,'') : t.name}">${t.name}</span>`).join('');
    const detailEntries = Object.entries(v.details).filter(([k])=> k!==employeeKey && k!==locKey);
    const detailsHtml = detailEntries.length ? `<details class="vdetails"><summary>Notes &amp; requirements (${detailEntries.length})</summary>${detailEntries.map(([k,val])=>`<div class="detail-item"><b>${k}</b>${(val||'').toString().replace(/</g,'&lt;')}</div>`).join('')}</details>` : '';

    const cardClass = fitInfo ? `vcard has-fit fit-${fitInfo.fit}` : 'vcard';
    const fitPill = fitInfo ? `<span class="fit-pill fit-${fitInfo.fit}">${fitInfo.fit==='yes'?'Fit':fitInfo.fit==='cond'?'Check':'No fit'}</span>` : '';
    const fitReason = fitInfo && fitInfo.fit !== 'yes' ? `<div class="fit-reason">${fitInfo.label}</div>` : '';

    return `<div class="${cardClass}">
      <div class="vcard-head">
        <h3>${v.name}</h3>
        <div class="badge-row">${fitPill}<span class="status-pill ${statusClass(v.status)}">${v.status}</span></div>
      </div>
      ${v.uqc ? `<div class="uqc-note">⚠ ${v.uqc}</div>` : ''}
      ${fitReason}
      ${metaBits.length ? `<div class="meta-row">${metaBits.join('')}</div>` : ''}
      <div class="tagwrap" id="tw-${idx}">${chips}</div>
      ${v.tags.length > 20 ? `<span class="expand-toggle" data-idx="${idx}">Show all ${v.tags.length} →</span>` : ''}
      ${detailsHtml}
    </div>`;
  }).join('');

  grid.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      const vendor = e.target.getAttribute('data-vendor');
      const tag = e.target.getAttribute('data-tag');
      showToast(`This is live data from your Google Sheet. To change "${tag}" for ${vendor}, edit the Sheet — it'll show up here after you hit Refresh.`);
    });
  });
  grid.querySelectorAll('.expand-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const idx = e.target.getAttribute('data-idx');
      document.getElementById('tw-'+idx).classList.add('expanded');
      e.target.style.display = 'none';
    });
  });
}

function render(){
  if(!state.category) return;
  renderCategoryTabs();
  msState.industry = new Set();
  msState.feature = new Set();
  document.getElementById('chkEmp').value = '';
  renderMultiSelect('industry');
  renderMultiSelect('feature');
  renderGeoDropdown();
  renderGrid();
}

document.getElementById('searchInput').addEventListener('input', (e)=>{ state.search = e.target.value; renderGrid(); });
document.getElementById('statusToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('.status-pill-btn');
  if(!btn) return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  state.statusFilter = btn.getAttribute('data-status');
  renderGrid();
});
document.getElementById('chkEmp').addEventListener('input', renderGrid);
document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('clearFiltersBtn').addEventListener('click', ()=>{
  msState.industry = new Set();
  msState.feature = new Set();
  geoState = '';
  document.getElementById('chkEmp').value = '';
  state.search = '';
  state.statusFilter = 'all';
  document.getElementById('searchInput').value = '';
  [...document.getElementById('statusToggle').children].forEach(b=>b.classList.remove('on'));
  document.querySelector('.status-pill-btn[data-status="all"]').classList.add('on');
  renderMultiSelect('industry');
  renderMultiSelect('feature');
  renderGeoDropdown();
  renderGrid();
});

loadData();
</script>
</body>
</html>
