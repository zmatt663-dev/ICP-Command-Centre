<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICP Command Center — Software Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0F3031; --forest-2:#163F40; --forest-3:#1D4E4F; --lime:#B3FA68; --lime-dim:#8FD94C;
    --cream:#F7F5EF; --paper:#FFFFFF; --ink:#12201F; --ink-soft:#5B6B69; --line:#E4E0D4;
    --accept:#2F8F4E; --accept-bg:#E4F5E6; --reject:#C4433A; --reject-bg:#FBE9E7;
    --cond:#9A7B1F; --cond-bg:#FBF1D8; --special:#8B5FBF; --special-bg:#F0E9F8;
    --radius:10px; --shadow: 0 1px 2px rgba(15,48,49,0.06), 0 8px 24px -12px rgba(15,48,49,0.18);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:236px; flex-shrink:0; background:var(--forest); color:#DCEAE7; padding:22px 16px 20px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:10px; padding:2px 6px 22px;}
  .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--lime); display:flex; align-items:center; justify-content:center; color:var(--forest); font-family:'Fraunces',serif; font-weight:700; font-size:15px;}
  .brand .name{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; color:#fff; line-height:1.15;}
  .brand .sub{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; color:#93B0AC; text-transform:uppercase;}
  .nav-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#6E938E; margin:18px 10px 8px;}
  .cat-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .cat-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13.3px; color:#C9DDD9; transition:background .12s ease, color .12s ease;}
  .cat-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .cat-item.active{background:var(--lime); color:var(--forest); font-weight:600;}
  .cat-item .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.75;}
  .side-foot{margin-top:22px; padding:12px 12px; border-radius:10px; background:rgba(179,250,104,0.08); border:1px solid rgba(179,250,104,0.18); font-size:11.5px; line-height:1.5; color:#B8CFCB;}
  .side-foot b{color:var(--lime); font-weight:600;}
  .side-refresh{margin-top:10px; width:100%; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#DCEAE7; font-size:11.5px; cursor:pointer; font-family:'Inter',sans-serif;}
  .side-refresh:hover{background:rgba(255,255,255,0.12);}
  .side-updated{font-size:10px; color:#6E938E; margin-top:6px; text-align:center; font-family:'IBM Plex Mono',monospace;}
  .main{flex:1; min-width:0;}
  .topbar{position:sticky; top:0; z-index:5; background:rgba(247,245,239,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:18px 34px 16px;}
  .topbar h1{font-size:23px; margin:0 0 3px; color:var(--forest);}
  .topbar .desc{font-size:12.8px; color:var(--ink-soft); margin-bottom:14px;}
  .searchrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .search-box{flex:1; min-width:220px; display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:9px 13px; box-shadow:var(--shadow);}
  .search-box input{border:none; outline:none; font-size:13.5px; flex:1; background:transparent; font-family:'Inter',sans-serif;}
  .search-box svg{flex-shrink:0; opacity:.5;}
  .pill-toggle{display:flex; background:var(--paper); border:1px solid var(--line); border-radius:9px; overflow:hidden; box-shadow:var(--shadow);}
  .pill-toggle button{border:none; background:transparent; padding:9px 14px; font-size:12.6px; font-weight:600; cursor:pointer; color:var(--ink-soft); font-family:'Inter',sans-serif; white-space:nowrap;}
  .pill-toggle button.on{background:var(--forest); color:var(--lime);}
  .content{padding:22px 34px 60px;}
  .checker{background:linear-gradient(135deg, var(--forest) 0%, var(--forest-3) 100%); border-radius:16px; padding:22px 26px; color:#fff; margin-bottom:26px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .checker::after{content:""; position:absolute; right:-40px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(179,250,104,0.18), transparent 70%);}
  .checker-head{display:flex; align-items:baseline; gap:10px; margin-bottom:4px; position:relative;}
  .checker-head .tag{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase; background:var(--lime); color:var(--forest); padding:3px 8px; border-radius:20px; font-weight:700;}
  .checker h2{font-size:19px; margin:6px 0 3px; color:#fff;}
  .checker p.sub{font-size:12.6px; color:#B9D2CD; margin:0 0 16px; max-width:640px;}
  .checker-grid{display:flex; gap:10px; flex-wrap:wrap; position:relative;}
  .checker-grid input{font-family:'Inter',sans-serif; font-size:13px; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08); color:#fff; outline:none; min-width:170px;}
  .checker-grid input::placeholder{color:#9FC0BA;}
  .checker-grid input:focus{border-color:var(--lime); background:rgba(255,255,255,0.13);}
  .checker-grid select{font-family:'Inter',sans-serif; font-size:13px; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08); color:#fff; outline:none; min-width:170px; cursor:pointer;}
  .checker-grid select:focus{border-color:var(--lime); background:rgba(255,255,255,0.13);}
  .checker-grid select option{color:#111;}
  .ms{position:relative; min-width:200px;}
  .ms-toggle{width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:'Inter',sans-serif; font-size:13px; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08); color:#fff; cursor:pointer;}
  .ms-toggle:hover{background:rgba(255,255,255,0.13);}
  .ms-toggle .ms-label{opacity:.92;}
  .ms-toggle .ms-caret{opacity:.6; font-size:10px;}
  .ms-panel{display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:20; width:260px; max-height:260px; overflow-y:auto; background:var(--forest-2); border:1px solid rgba(255,255,255,0.16); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,0.35); padding:6px;}
  .ms-panel.open{display:block;}
  .ms-option{display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; font-size:12.5px; color:#DCEAE7; cursor:pointer;}
  .ms-option:hover{background:rgba(255,255,255,0.08);}
  .ms-option input{accent-color:var(--lime); cursor:pointer;}
  .ms-empty{padding:10px 8px; font-size:12px; color:#9FC0BA;}
  .ms-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; width:100%;}
  .ms-chip{display:inline-flex; align-items:center; gap:5px; background:rgba(179,250,104,0.14); color:var(--lime); border:1px solid rgba(179,250,104,0.3); border-radius:20px; padding:3px 6px 3px 10px; font-size:11px; font-weight:600;}
  .ms-chip-x{background:none; border:none; color:var(--lime); cursor:pointer; font-size:13px; line-height:1; padding:0 3px;}
  .go-btn{background:var(--lime); color:var(--forest); border:none; font-weight:700; font-size:13px; padding:10px 20px; border-radius:8px; cursor:pointer; font-family:'Inter',sans-serif;}
  .go-btn:hover{background:var(--lime-dim);}
  .check-results{margin-top:16px; position:relative;}
  .check-results .hint{font-size:12px; color:#9FC0BA;}
  .result-row{display:flex; align-items:center; gap:10px; padding:9px 12px; background:rgba(255,255,255,0.07); border-radius:8px; margin-top:7px; font-size:13px;}
  .result-row .rv{font-weight:600; min-width:170px;}
  .result-row .rd{font-size:11.5px; color:#B9D2CD; flex:1;}
  .badge-fit{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.05em; padding:3px 9px; border-radius:20px; font-weight:700; text-transform:uppercase;}
  .badge-fit.fit-yes{background:var(--lime); color:var(--forest);}
  .badge-fit.fit-no{background:#5A3A38; color:#F3B9B4;}
  .badge-fit.fit-cond{background:#5A4E23; color:#F3DE9C;}
  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:4px 0 12px;}
  .section-title h2{font-size:17px; margin:0; color:var(--forest);}
  .section-title .count{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);}
  .vgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:14px;}
  .vcard{background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:16px 17px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
  .vcard-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .vcard-head h3{font-size:16.5px; margin:0; color:var(--ink); line-height:1.25;}
  .status-pill{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:20px; font-weight:700; flex-shrink:0;}
  .status-active{background:var(--accept-bg); color:var(--accept);}
  .status-paused{background:var(--cond-bg); color:var(--cond);}
  .status-inactive{background:var(--reject-bg); color:var(--reject);}
  .meta-row{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11.8px; color:var(--ink-soft);}
  .meta-row span b{color:var(--ink); font-weight:600;}
  .tagwrap{display:flex; flex-wrap:wrap; gap:5px; max-height:98px; overflow:hidden; position:relative; transition:max-height .2s ease;}
  .tagwrap.expanded{max-height:2000px;}
  .chip{font-size:11px; padding:3.5px 9px; border-radius:20px; font-weight:600; cursor:pointer; border:1px solid transparent; user-select:none; transition:transform .08s ease;}
  .chip:active{transform:scale(0.96);}
  .chip.accept{background:var(--accept-bg); color:var(--accept);}
  .chip.reject{background:var(--reject-bg); color:var(--reject);}
  .chip.conditional{background:var(--cond-bg); color:var(--cond);}
  .chip.special{background:var(--special-bg); color:var(--special);}
  .expand-toggle{font-size:11px; color:var(--forest-3); font-weight:600; cursor:pointer; align-self:flex-start;}
  details.vdetails{border-top:1px dashed var(--line); padding-top:8px; margin-top:2px;}
  details.vdetails summary{font-size:11.5px; font-weight:600; color:var(--forest-3); cursor:pointer; list-style:none;}
  details.vdetails summary::-webkit-details-marker{display:none;}
  details.vdetails summary::before{content:"+ ";}
  details.vdetails[open] summary::before{content:"– ";}
  .detail-item{margin-top:8px; font-size:12px; line-height:1.55; color:var(--ink-soft);}
  .detail-item b{display:block; color:var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace; margin-bottom:2px;}
  .detail-item + .detail-item{margin-top:10px;}
  .empty-cat{background:var(--paper); border:1px dashed var(--line); border-radius:13px; padding:40px 30px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .empty-cat b{color:var(--forest); display:block; font-family:'Fraunces',serif; font-size:16px; margin-bottom:6px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--forest); color:#fff; padding:11px 18px; border-radius:10px; font-size:12.8px; box-shadow:0 10px 30px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:all .25s ease; display:flex; align-items:center; gap:10px; z-index:50; max-width:440px;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .dot{width:7px; height:7px; border-radius:50%; background:var(--lime); flex-shrink:0;}
  .loadstate{padding:80px 20px; text-align:center; color:var(--ink-soft);}
  .loadstate .spin{width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--forest); margin:0 auto 14px; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-box{background:#FBE9E7; border:1px solid #EFC1BC; color:#8A2E27; border-radius:12px; padding:18px 20px; font-size:13px; line-height:1.6; max-width:640px; margin:20px auto;}
  .err-box b{display:block; font-family:'Fraunces',serif; font-size:16px; margin-bottom:6px;}
  ::-webkit-scrollbar{width:9px; height:9px;} ::-webkit-scrollbar-thumb{background:#D8D3C4; border-radius:20px;}
  @media (max-width:820px){.sidebar{position:relative; height:auto; width:100%;} .shell{flex-direction:column;} .content, .topbar{padding-left:18px; padding-right:18px;}}
</style>
</head>

label": "HCM", "synonyms": ["hcm", "human capital management"]}, {"label": "Payroll", "synonyms": ["payroll"]}, {"label": "Benefits Administration", "synonyms": ["benefits administration"]}, {"label": "Time & Attendance", "synonyms": ["time & attendance"]}, {"label": "Applicant Tracking (ATS)", "synonyms": ["ats", "applicant tracking"]}, {"label": "Performance Management", "synonyms": ["performance management"]}, {"label": "Onboarding", "synonyms": ["onboarding"]}], "CMMS": [{"label": "Preventive Maintenance", "synonyms": ["preventive maintenance"]}, {"label": "Work Order Management", "synonyms": ["work order management"]}, {"label": "Asset Tracking", "synonyms": ["asset tracking"]}, {"label": "Inventory/Parts Management", "synonyms": ["inventory/parts management"]}, {"label": "Inspection Management", "synonyms": ["inspection management"]}], "Legal Practice Management": [{"label": "Case Management", "synonyms": ["case management"]}, {"label": "Time & Billing", "synonyms": ["time & billing"]}, {"label": "Document Management", "synonyms": ["document management"]}, {"label": "Client Intake", "synonyms": ["client intake"]}, {"label": "Trust Accounting", "synonyms": ["trust accounting"]}], "Point of Sale": [{"label": "Inventory Management", "synonyms": ["inventory management"]}, {"label": "Payment Processing", "synonyms": ["payment processing"]}, {"label": "Customer Loyalty", "synonyms": ["customer loyalty"]}, {"label": "Multi-location Support", "synonyms": ["multi-location support"]}, {"label": "Reporting & Analytics", "synonyms": ["reporting & analytics"]}], "Project Management": [{"label": "Task Management", "synonyms": ["task management"]}, {"label": "Gantt Charts", "synonyms": ["gantt charts"]}, {"label": "Resource Management", "synonyms": ["resource management"]}, {"label": "Time Tracking", "synonyms": ["time tracking"]}, {"label": "Team Collaboration", "synonyms": ["team collaboration"]}, {"label": "Reporting & Analytics", "synonyms": ["reporting & analytics"]}], let DATA = {};
let state = { category: null, statusFilter: 'all', search: '' };

function buildUrl(){
  const ranges = CATEGORIES.map(c => 'ranges=' + encodeURIComponent(c)).join('&');
  // cache-bust: browsers/CDNs can otherwise serve a stale cached response for this exact URL
  return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchGet?${ranges}&key=${API_KEY}&_=${Date.now()}`;
}

function rowsToVendors(values){
  if(!values || values.length < 2) return [];
  const header = values[0];
  const findCol = re => header.findIndex(h => h && re.test(h.toString()));
  const cName = findCol(/^name$/i), cStatus = findCol(/^status$/i),
        cEmp = findCol(/emp count|employee|no\.?\s*of\b|provider|# of users|no\. of users/i),
        cGeo = findCol(/geograph|location/i),
        cFeat = findCol(/^features/i), cNotes = findCol(/^notes/i), cDonts = findCol(/don'?ts?/i);
  const indCols = header.reduce((arr,h,i)=>{ if(h && h.toString().startsWith('Accepted Industry')) arr.push(i); return arr; }, []);
  const vendors = [];
  for(let i=1;i<values.length;i++){
    const row = values[i];
    const name = row[cName]; if(!name) continue;
    const tags = [];
    indCols.forEach(c=>{ const v = row[c]; if(v) tags.push({ name: v, status: 'accept', note: null }); });
    const details = {};
    if(cEmp>=0 && row[cEmp]) details['Emp Count'] = row[cEmp];
    if(cGeo>=0 && row[cGeo]) details['Geography'] = row[cGeo];
    if(cFeat>=0 && row[cFeat]) details['Features'] = row[cFeat];
    if(cNotes>=0 && row[cNotes]) details['Notes'] = row[cNotes];
    if(cDonts>=0 && row[cDonts]) details["Don'ts"] = row[cDonts];
    vendors.push({ name, status: (cStatus>=0 && row[cStatus]) || 'Active', tags, details });
  }
  return vendors;
}

async function loadData(){
  document.getElementById('contentArea').innerHTML = '<div class="loadstate"><div class="spin"></div>Loading your live ICP data…</div>';
  try{
    const res = await fetch(buildUrl(), { cache: 'no-store' });
    if(!res.ok){
      const body = await res.text();
      throw new Error(`HTTP ${res.status}: ${body.slice(0,300)}`);
    }
    const json = await res.json();
    DATA = {};
    (json.valueRanges || []).forEach(vr => {
      const catName = vr.range.split('!')[0].replace(/^'|'$/g, '');
      DATA[catName] = rowsToVendors(vr.values);
    });
    state.category = state.category && DATA[state.category] ? state.category : CATEGORIES.find(c => DATA[c] && DATA[c].length) || CATEGORIES[0];
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  } catch(err){
    document.getElementById('contentArea').innerHTML = `<div class="err-box"><b>Couldn't load live data</b>
      ${err.message}<br><br>
      Common causes: the sheet isn't shared as "Anyone with the link → Viewer", the Google Sheets API isn't enabled on the project, the API key restrictions block this page, or a tab name doesn't exactly match ${CATEGORIES.join(', ')}.</div>`;
    document.getElementById('catTitle').textContent = 'Connection error';
    document.getElementById('catDesc').textContent = '';
  }
}

function catCount(cat){ return (DATA[cat] || []).length; }

function renderSidebar(){
  const list = document.getElementById('catList');
  list.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const has = DATA[cat] && DATA[cat].length;
    const li = document.createElement('li');
    li.className = 'cat-item' + (cat===state.category?' active':'') + (has?'':' disabled');
    li.style.opacity = has ? 1 : 0.4;
    li.innerHTML = `<span>${cat}</span><span class="cnt">${has ? catCount(cat) : '—'}</span>`;
    li.onclick = ()=>{ state.category = cat; state.search=''; document.getElementById('searchInput').value=''; render(); };
    list.appendChild(li);
  });
}

function statusClass(s){
  const l = (s||'').toLowerCase();
  if(l==='paused') return 'status-paused';
  if(l==='inactive') return 'status-inactive';
  return 'status-active';
}

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=> t.classList.remove('show'), 3200);
}

const msState = { industry: new Set(), feature: new Set() };

function getIndustryOptions(){
  const cat = DATA[state.category] || [];
  const names = new Set();
  cat.forEach(v => v.tags.forEach(t => names.add(t.name)));
  return [...names].sort();
}
function getFeatureOptionLabels(){
  const list = FEATURE_LISTS[state.category] || [];
  return list.map(f => f.label);
}

function toggleMsPanel(kind){
  const panel = document.getElementById(`ms-${kind}-panel`);
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.ms-panel.open').forEach(p => p.classList.remove('open'));
  if(!isOpen) panel.classList.add('open');
}
document.addEventListener('click', ()=> {
  document.querySelectorAll('.ms-panel.open').forEach(p => p.classList.remove('open'));
});

function renderMultiSelect(kind){
  const options = kind === 'industry' ? getIndustryOptions() : getFeatureOptionLabels();
  const selected = msState[kind];
  const panel = document.getElementById(`ms-${kind}-panel`);
  if(!panel) return;
  panel.innerHTML = options.length ? options.map(opt => {
    const safe = opt.replace(/"/g,'&quot;');
    return `<label class="ms-option"><input type="checkbox" value="${safe}" ${selected.has(opt)?'checked':''} data-kind="${kind}"><span>${opt}</span></label>`;
  }).join('') : `<div class="ms-empty">No ${kind==='industry'?'industries':'standard features'} for this category</div>`;
  panel.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const val = e.target.value;
      if(e.target.checked) msState[kind].add(val); else msState[kind].delete(val);
      renderChips(kind);
    });
  });
  renderChips(kind);
}

function renderChips(kind){
  const selected = [...msState[kind]];
  const chipsEl = document.getElementById(`ms-${kind}-chips`);
  const toggleBtn = document.getElementById(`ms-${kind}-toggle`);
  if(toggleBtn) toggleBtn.querySelector('.ms-label').textContent = selected.length
    ? `${selected.length} ${kind === 'industry' ? 'industr' + (selected.length>1?'ies':'y') : 'feature'+(selected.length>1?'s':'')} selected`
    : (kind === 'industry' ? 'Select industries' : 'Select features');
  if(!chipsEl) return;
  chipsEl.innerHTML = selected.map(v => {
    const safe = v.replace(/"/g,'&quot;');
    return `<span class="ms-chip">${v}<button type="button" class="ms-chip-x" data-kind="${kind}" data-val="${safe}">×</button></span>`;
  }).join('');
  chipsEl.querySelectorAll('.ms-chip-x').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const k = e.target.getAttribute('data-kind'), val = e.target.getAttribute('data-val');
      msState[k].delete(val);
      renderMultiSelect(k);
    });
  });
}

function renderGrid(){
  const cat = DATA[state.category] || [];
  const grid = document.getElementById('vgrid');
  if(!grid) return;
  const q = state.search.trim().toLowerCase();
  let filtered = cat.filter(v=>{
    if(state.statusFilter !== 'all' && v.status !== state.statusFilter) return false;
    if(!q) return true;
    if(v.name.toLowerCase().includes(q)) return true;
    return v.tags.some(t=>t.name.toLowerCase().includes(q));
  });
  document.getElementById('gridTitle').textContent = state.category + ' vendors';
  document.getElementById('gridCount').textContent = filtered.length + ' of ' + cat.length;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-cat" style="grid-column:1/-1;"><b>No matches</b>Try a different search term or status filter.</div>`;
    return;
  }
  grid.innerHTML = filtered.map((v, idx)=>{
    const employeeKey = Object.keys(v.details).find(k => /emp count|employee|provider|user/i.test(k));
    const locKey = Object.keys(v.details).find(k => /geograph|location/i.test(k));
    const metaBits = [];
    if(employeeKey) metaBits.push(`<span><b>${v.details[employeeKey]}</b></span>`);
    if(locKey) metaBits.push(`<span>${v.details[locKey]}</span>`);
    const chips = v.tags.map((t,i)=>`<span class="chip ${t.status}" data-vendor="${v.name.replace(/"/g,'')}" data-tag="${t.name.replace(/"/g,'')}" title="${t.note ? t.note.replace(/"/g,'') : t.name}">${t.name}</span>`).join('');
    const detailEntries = Object.entries(v.details).filter(([k])=> k!==employeeKey && k!==locKey);
    const detailsHtml = detailEntries.length ? `<details class="vdetails"><summary>Notes &amp; requirements (${detailEntries.length})</summary>${detailEntries.map(([k,val])=>`<div class="detail-item"><b>${k}</b>${(val||'').toString().replace(/</g,'&lt;')}</div>`).join('')}</details>` : '';
    return `<div class="vcard">
      <div class="vcard-head"><h3>${v.name}</h3><span class="status-pill ${statusClass(v.status)}">${v.status}</span></div>
      ${metaBits.length ? `<div class="meta-row">${metaBits.join('')}</div>` : ''}
      <div class="tagwrap" id="tw-${idx}">${chips}</div>
      ${v.tags.length > 20 ? `<span class="expand-toggle" data-idx="${idx}">Show all ${v.tags.length} →</span>` : ''}
      ${detailsHtml}
    </div>`;
  }).join('');

  grid.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      const vendor = e.target.getAttribute('data-vendor');
      const tag = e.target.getAttribute('data-tag');
      showToast(`This is live data from your Google Sheet. To change "${tag}" for ${vendor}, edit their Accepted Industry cells in the Sheet — it'll show up here after you hit Refresh.`);
    });
  });
  grid.querySelectorAll('.expand-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const idx = e.target.getAttribute('data-idx');
      document.getElementById('tw-'+idx).classList.add('expanded');
      e.target.style.display = 'none';
    });
  });
}

function parseEmpFloor(text){
  if(!text) return null;
  const nums = (text.toString().match(/\d[\d,]*/g) || []).map(n => parseInt(n.replace(/,/g,''), 10));
  if(nums.length === 0) return null;
  return Math.min(...nums);
}

function geoMatches(locVal, country){
  if(!country) return { ok: true, note: null };
  if(!locVal) return { ok: true, note: null };
  const lower = locVal.toLowerCase();
  if(/worldwide|global|all countries|anywhere|international/.test(lower)) return { ok: true, note: null };
  const aliases = (GEO_ALIASES[country] || []).map(a => a.toLowerCase());
  const candidates = [country.toLowerCase(), ...aliases];
  const ok = candidates.some(c => lower.includes(c));
  return { ok, note: ok ? null : `geo may not match (${locVal})` };
}

function featureMatches(v, featureLabel){
  if(!featureLabel) return { ok: true, note: null };
  const list = FEATURE_LISTS[state.category] || [];
  const entry = list.find(f => f.label === featureLabel);
  if(!entry) return { ok: true, note: null };
  const combined = [v.details['Features'], v.details['Notes'], v.details["Don'ts"]].filter(Boolean).join(' ').toLowerCase();
  const ok = entry.synonyms.some(s => combined.includes(s));
  return { ok, note: ok ? null : `"${featureLabel}" not mentioned in listing — verify manually` };
}

function industriesMatch(v, selectedIndustries){
  if(selectedIndustries.length === 0) return { ok: true, fails: [] };
  const fails = [];
  for(const ind of selectedIndustries){
    const tag = v.tags.find(t => t.name === ind);
    if(!tag || tag.status !== 'accept') fails.push(ind);
  }
  return { ok: fails.length === 0, fails };
}

function featuresMatch(v, selectedFeatures){
  if(selectedFeatures.length === 0) return { ok: true, fails: [] };
  const fails = [];
  for(const feat of selectedFeatures){
    const { ok } = featureMatches(v, feat);
    if(!ok) fails.push(feat);
  }
  return { ok: fails.length === 0, fails };
}

function runCheck(){
  const selectedIndustries = [...msState.industry];
  const selectedFeatures = [...msState.feature];
  const empInput = document.getElementById('chkEmp').value.trim();
  const empNum = empInput ? parseInt(empInput, 10) : null;
  const geoCountry = document.getElementById('chkGeo').value;
  const box = document.getElementById('chkResults');
  if(selectedIndustries.length === 0){ box.innerHTML = `<div class="hint">Select at least one industry to check against every vendor in ${state.category}.</div>`; return; }
  const cat = (DATA[state.category] || []).filter(v => v.status !== 'Inactive');
  const rows = cat.map(v=>{
    const { ok: indOk, fails: indFails } = industriesMatch(v, selectedIndustries);
    const { ok: featOk, fails: featFails } = featuresMatch(v, selectedFeatures);

    const locKey = Object.keys(v.details).find(k => /geograph|location/i.test(k));
    const locVal = locKey ? v.details[locKey] : '';
    const { ok: geoOk, note: geoNote } = geoMatches(locVal, geoCountry);

    const empKey = Object.keys(v.details).find(k => /emp count|employee|provider|user/i.test(k));
    const empFloor = empKey ? parseEmpFloor(v.details[empKey]) : null;
    let empOk = true, empNote = null;
    if(empNum !== null){
      if(empFloor === null){ empOk = true; empNote = 'employee count unclear — verify manually'; }
      else if(empNum < empFloor){ empOk = false; empNote = `below vendor's minimum (${v.details[empKey]})`; }
    }

    let fit = 'no', label = 'No match found';
    if(!indOk){
      fit = 'no';
      label = `Doesn't accept: ${indFails.join(', ')}`;
    } else {
      const hardFails = !geoOk || !empOk || !featOk;
      const featIssue = featFails.length ? `Doesn't match feature: ${featFails.join(', ')}` : null;
      const issues = [geoNote, empNote, featIssue].filter(Boolean);
      if(hardFails){ fit = 'no'; label = issues.join('; '); }
      else if(issues.length){ fit = 'cond'; label = issues.join('; '); }
      else { fit = 'yes'; label = 'Fits ICP'; }
    }
    return {v, fit, label};
  }).sort((a,b)=>{ const order={yes:0,cond:1,no:2}; return order[a.fit]-order[b.fit]; });

  if(!rows.some(r => r.fit === 'yes')){
    box.innerHTML = `<div class="hint">No vendor matches all of these.</div>`;
    return;
  }
  box.innerHTML = rows.map(r=>`
    <div class="result-row">
      <span class="badge-fit fit-${r.fit==='yes'?'yes':r.fit==='cond'?'cond':'no'}">${r.fit==='yes'?'Fit':r.fit==='cond'?'Check':'No fit'}</span>
      <span class="rv">${r.v.name}</span>
      <span class="rd">${r.label}${r.v.status!=='Active' ? ' · '+r.v.status : ''}</span>
    </div>`).join('');
}

function countryOptions(){
  return '<option value="">Any geography</option>' + COUNTRIES.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function renderContent(){
  document.getElementById('contentArea').innerHTML = `
    <div class="checker">
      <div class="checker-head"><span class="tag">Quick check</span></div>
      <h2>Does this lead fit anyone's ICP?</h2>
      <p class="sub">Pick one or more industries and features, employee count and geography an SDR is qualifying against. Selecting multiple industries or features finds vendors that accept ALL of them, not just any one.</p>
      <div class="checker-grid">
        <div class="ms" id="ms-industry">
          <button type="button" class="ms-toggle" id="ms-industry-toggle"><span class="ms-label">Select industries</span><span class="ms-caret">▾</span></button>
          <div class="ms-panel" id="ms-industry-panel"></div>
        </div>
        <div class="ms" id="ms-feature">
          <button type="button" class="ms-toggle" id="ms-feature-toggle"><span class="ms-label">Select features</span><span class="ms-caret">▾</span></button>
          <div class="ms-panel" id="ms-feature-panel"></div>
        </div>
        <input id="chkEmp" type="number" placeholder="Employee count, e.g. 150" min="0">
        <select id="chkGeo">${countryOptions()}</select>
        <button class="go-btn" id="chkBtn">Check fit</button>
      </div>
      <div class="ms-chips" id="ms-industry-chips"></div>
      <div class="ms-chips" id="ms-feature-chips"></div>
      <div class="check-results" id="chkResults"></div>
    </div>
    <div class="section-title"><h2 id="gridTitle">Vendors</h2><span class="count" id="gridCount"></span></div>
    <div class="vgrid" id="vgrid"></div>
  `;
  document.getElementById('chkBtn').addEventListener('click', runCheck);
  msState.industry = new Set();
  msState.feature = new Set();
  renderMultiSelect('industry');
  renderMultiSelect('feature');
  document.getElementById('ms-industry-toggle').addEventListener('click', (e)=>{ e.stopPropagation(); toggleMsPanel('industry'); });
  document.getElementById('ms-feature-toggle').addEventListener('click', (e)=>{ e.stopPropagation(); toggleMsPanel('feature'); });
}

function render(){
  if(!state.category) return;
  document.getElementById('catTitle').textContent = state.category;
  document.getElementById('catDesc').textContent = `Vendor ICPs for ${state.category} — live from your Google Sheet.`;
  renderSidebar();
  renderContent();
  renderGrid();
}

document.addEventListener('click', (e)=>{
  if(e.target.id === 'searchInput'){ /* handled below */ }
});
document.addEventListener('input', (e)=>{
  if(e.target.id === 'searchInput'){ state.search = e.target.value; renderGrid(); }
});
document.getElementById('statusToggle').addEventListener('click', (e)=>{
  if(e.target.tagName !== 'BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
  state.statusFilter = e.target.getAttribute('data-status');
  renderGrid();
});
document.getElementById('refreshBtn').addEventListener('click', loadData);

loadData();
</script>
